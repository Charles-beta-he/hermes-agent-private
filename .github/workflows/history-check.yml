name: History Check

# Rejects PRs whose branch has no common ancestor with the target project's
# actual base branch. Public upstream targets main; downstream/private projects
# may use another default or PR base branch (for example private/main).
#
# In May 2026 PR #25045 was merged from a branch that had been disconnected
# from its target branch's history (likely an accidental `git checkout --orphan`
# or `.git/` re-init). GitHub's merge UI does not refuse unrelated histories,
# so the PR landed with a parent-less root and collapsed git blame history.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-common-ancestor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # full history both sides for merge-base

      - name: Reject PRs with no common ancestor on project base
        env:
          # github.base_ref is the exact PR target. The repository default is
          # the project-level fallback for non-PR/reusable invocations.
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_REF" ] || ! git check-ref-format --branch "$BASE_REF" >/dev/null 2>&1; then
            echo "::error::Unable to resolve a valid project base branch: '$BASE_REF'"
            exit 1
          fi

          BASE_REMOTE_REF="refs/remotes/origin/${BASE_REF}"
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:${BASE_REMOTE_REF}"

          if ! BASE=$(git merge-base "$BASE_REMOTE_REF" HEAD 2>/dev/null) || [ -z "$BASE" ]; then
            echo ""
            echo "::error::This PR has no common ancestor with ${BASE_REF}."
            echo ""
            echo "Your branch's history is disconnected from the project's target branch."
            echo "Common causes:"
            echo "  - the branch was created with 'git checkout --orphan'"
            echo "  - '.git/' was re-initialized at some point during the work"
            echo "  - the branch was force-pushed from an unrelated repository"
            echo ""
            echo "To fix, rebase your changes onto the current project base:"
            echo "  git fetch origin '${BASE_REF}'"
            echo "  git checkout -b fix-branch 'origin/${BASE_REF}'"
            echo "  # re-apply your changes (cherry-pick, copy files, etc.)"
            echo "  git push -f origin fix-branch"
            exit 1
          fi
          echo "::notice::Common ancestor with ${BASE_REF}: $BASE"
