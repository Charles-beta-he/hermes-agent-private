# Sanitized Hermes config template.
# Copy selected sections into ~/.hermes/config.yaml after running `hermes setup`.
# Do not paste secrets into this template file if you plan to commit or share it.

model:
  provider: openrouter
  model: openai/gpt-5.5

fallback_providers:
  - provider: anthropic
    model: claude-sonnet-4
  - provider: google-gemini-cli
    model: gemini-3.1-pro-preview

safety:
  external_side_effects_default: fail_closed
  require_exact_target_for_delivery: true
  require_payload_digest_for_external_writes: true
  require_rollback_plan_for_apply: true
  never_type_credentials: true
  completion_claim_requires_fresh_evidence: true

onboarding:
  use_private_experience_pack: true
  user_profile_template: "$HERMES_HOME/templates/private-experience/user-profile.example.json"
  project_profile_template: "$HERMES_HOME/templates/private-experience/project-profile.example.json"
  default_side_effect_state: disabled

tools:
  browser: true
  computer_use: true
  file: true
  terminal: true
  web: true
  cronjob: true

dashboard:
  host: 127.0.0.1
  port: 9119
  open_browser: false

gateway:
  enabled: false
  platforms: {}

cron:
  default_delivery: local
  require_explicit_target_for_external_messages: true

taskpool:
  mutation_enabled: false
  require_acceptance_criteria: true
  require_evidence_before_done: true
